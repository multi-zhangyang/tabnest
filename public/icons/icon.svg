<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    TabNest 标识:「巢」托住书签。
    一条向上开口的粗弧是巢,里面两张错落叠放的圆角卡片是被收进来的书签——
    也暗合产品里「按热度有大小」的排布。纯几何、无描边依赖,缩小到 16px 仍可辨认。
  -->
  <defs>
    <linearGradient id="tn-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B3B45"/>
      <stop offset="1" stop-color="#191920"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tn-tile)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round">
    <path d="M11 35 C 11 51, 53 51, 53 35"/>
  </g>
  <rect x="17.5" y="14" width="15.5" height="21" rx="5" fill="#FFFFFF"/>
  <rect x="35" y="21" width="12" height="16" rx="4.2" fill="#FFFFFF" opacity="0.58"/>
</svg>
