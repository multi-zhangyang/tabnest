name: 故障反馈
description: 报告可复现的问题
body:
  - type: input
    id: version
    attributes:
      label: 版本与构建编号
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器版本与系统
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、预期和实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或日志
      description: 请先移除私人网址与书签信息。
